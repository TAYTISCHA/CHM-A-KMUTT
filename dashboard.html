<!DOCTYPE html>
<html>

<head>

  <title>Dashboard</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<div class="container">

  <div class="logo">
    CHM-A-KMUTT
  </div>

  <h2 id="role"></h2>

  <br>

  <div id="adminBtn"></div>

  <button onclick="logout()">
    LOGOUT
  </button>

</div>

<script>

const role =
  localStorage.getItem('role');

if(!role){

  location.href='index.html';

}

document.getElementById(
  'role'
).innerText = role;

if(
  role === 'OWNER' ||
  role === 'SENIOR'
){

  document.getElementById(
    'adminBtn'
  ).innerHTML = `

    <button
      onclick="
        location.href=
        'admin.html'
      "
    >
      ADMIN PANEL
    </button>

  `;

}

function logout(){

  const deviceId =
    localStorage.getItem(
      'deviceId'
    );

  localStorage.clear();

  localStorage.setItem(
    'deviceId',
    deviceId
  );

  location.href='index.html';

}

</script>

</body>
</html>
