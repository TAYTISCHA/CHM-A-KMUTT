<!DOCTYPE html>
<html>

<head>

  <title>Dashboard</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<div class="container">

  <div class="logo">
    CHM-A-KMUTT
  </div>

  <h2 id="role"></h2>

  <br>

  <!-- ADMIN BUTTON -->
  <div id="adminButtons"></div>

  <br>

  <!-- VIEW FILES -->
  <button
    onclick="
      location.href='files.html'
    "
  >
    VIEW FILES
  </button>

  <br><br>

  <!-- LOGOUT -->
  <button onclick="logout()">
    LOGOUT
  </button>

</div>

<script>

const role =
  localStorage.getItem('role');

if(!role){

  location.href='index.html';

}

document.getElementById(
  'role'
).innerText =
'ROLE : ' + role;

/*
========================
ADMIN BUTTONS
========================
*/

if(

  role === 'OWNER'

  ||

  role === 'SENIOR'

){

  document.getElementById(
    'adminButtons'
  ).innerHTML = `

    <button
      onclick="
        location.href=
        'admin.html'
      "
    >
      ADMIN PANEL
    </button>

    <br><br>

    <button
      onclick="
        location.href=
        'upload.html'
      "
    >
      UPLOAD FILE
    </button>

  `;

}

/*
========================
LOGOUT
========================
*/

function logout(){

  const deviceId =
    localStorage.getItem(
      'deviceId'
    );

  localStorage.clear();

  localStorage.setItem(
    'deviceId',
    deviceId
  );

  location.href='index.html';

}

</script>

</body>
</html>
