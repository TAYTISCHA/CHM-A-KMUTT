<!DOCTYPE html>
<html>

<head>

  <title>Upload File</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <div class="logo">
    UPLOAD FILE
  </div>

  <input
    type="file"
    id="fileInput"
  >

  <br><br>

  <button onclick="uploadFile()">

  id="loadingPopup"
>

  <div class="loading-box">

    <div id="loadingText">
      UPLOADING...
    </div>

  </div>

</div>

<script src="js/config.js"></script>
<script src="js/security.js"></script>
<script src="js/upload.js"></script>

</body>
</html>
