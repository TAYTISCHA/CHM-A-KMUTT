<!DOCTYPE html>
<html>

<head>

  <title>
    VIEW FILE
  </title>

  <style>

    body{

      margin:0;
      padding:0;

      background:#111;

    }

    iframe{

      width:100vw;
      height:100vh;

      border:none;

      background:white;

    }

  </style>

</head>

<body>

<iframe id="viewer"></iframe>

<script>

const params =
  new URLSearchParams(
    location.search
  );

const url =
  params.get('url');

/*
========================
EXTRACT FILE ID
========================
*/

const match =
  url.match(/\/d\/(.*?)\//);

if(match){

  const fileId =
    match[1];

  /*
  ========================
  GOOGLE PREVIEW
  ========================
  */

  document.getElementById(
    'viewer'
  ).src =

    'https://drive.google.com/file/d/' +

    fileId +

    '/preview';

}

</script>

</body>
</html>
