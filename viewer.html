<!DOCTYPE html>
<html>

<head>

  <title>
    VIEW FILE
  </title>

  <style>

    body{

      margin:0;
      padding:0;

      background:#111;

    }

    iframe{

      width:100vw;
      height:100vh;

      border:none;

      background:white;

    }

  </style>

</head>

<body>

<iframe id="viewer"></iframe>

<script>

const params =
  new URLSearchParams(
    location.search
  );

const url =
  params.get('url');

const type =
  params.get('type');

/*
========================
PDF VIEWER
========================
*/

if(type.includes('pdf')){

  document.getElementById(
    'viewer'
  ).src =

    'https://docs.google.com/gview?embedded=1&url=' +

    encodeURIComponent(url);

}

/*
========================
IMAGE VIEWER
========================
*/

else{

  document.getElementById(
    'viewer'
  ).src = url;

}

</script>

</body>
</html>
