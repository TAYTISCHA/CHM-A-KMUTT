<!DOCTYPE html>
<html>
<body>

<button onclick="testPost()">
TEST POST
</button>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbyE5AGanT3Pcg___5X6htoy7W2gOCvJYgLQ_wrKlOAa9iXCBzunKR6DIBGFXAg5Q2i1nw/exec';

async function testPost(){

  try{

    const res =
      await fetch(API_URL,{

        method:'POST',

        headers:{
          'Content-Type':
          'text/plain'
        },

        body:JSON.stringify({

          action:'uploadFile',

          fileName:'test.txt',

          mimeType:'text/plain',

          studentId:'TEST',

          base64:'dGVzdA=='

        })

      });

    const text =
      await res.text();

    alert(text);

  }catch(err){

    alert(err);

  }

}

</script>

</body>
</html>
